<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found - Bunny Runner 🐰</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#DDA0DD">
    <!-- absolute paths: this page is served for any missing URL, at any depth -->
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
    <style>
        @font-face {
            font-family: 'Inter';
            font-weight: 100 900;
            font-display: swap;
            src: url('/assets/fonts/inter-latin-wght-normal.woff2') format('woff2');
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            font-family: 'Inter', system-ui, sans-serif;
            color: #13343b;
            background: linear-gradient(135deg, #ffd6e8 0%, #e6e6fa 55%, #d4f5e3 100%);
        }
        main {
            width: min(100%, 26rem);
            padding: 2rem 1.5rem;
            text-align: center;
            background: rgba(255, 255, 255, 0.85);
            border: 3px solid #ffb6c1;
            border-radius: 2rem;
            box-shadow: 0 1rem 3rem rgba(255, 105, 180, 0.25);
        }
        .bunny { display: block; margin: 0 auto; animation: hop 1.2s ease-in-out infinite; }
        h1 { margin: 0.25rem 0 0; font-size: 3.5rem; color: #ff69b4; }
        p { margin: 0.5rem 0 1.5rem; color: #626c71; }
        a {
            display: inline-block;
            padding: 0.8rem 1.6rem;
            border-radius: 999px;
            color: #fff;
            font-weight: 700;
            text-decoration: none;
            letter-spacing: 0.05em;
            background: linear-gradient(135deg, #ff69b4, #ffa6c9);
            box-shadow: 0 0.4rem 1rem rgba(255, 105, 180, 0.4);
        }
        a:hover, a:focus-visible { transform: translateY(-2px); }
        @keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1rem); } }
        @media (prefers-reduced-motion: reduce) { .bunny { animation: none; } }
    </style>
</head>
<body>
    <main>
        <img class="bunny" src="/assets/icons/favicon.svg" alt="" width="96" height="96">
        <h1>404</h1>
        <h2>This burrow is empty!</h2>
        <p>The page you hopped to doesn't exist.</p>
        <a href="/">BACK TO THE GAME</a>
    </main>
</body>
</html>
