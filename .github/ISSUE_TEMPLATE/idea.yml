name: Idea
description: Suggest something that would make the game cuter, faster or more fun
title: "[Idea] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: "**Bunny Runner is complete (v1.0.0) and closed to changes.** Ideas aren't being taken on here. The game is MIT licensed, so a fork can run with yours."
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it be fun?
      description: Games like this stay tiny on purpose, so a short "why" helps a lot.
