name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the wiring checks and the smoke test
        run: npm test
        env:
          CHROME_BIN: google-chrome # preinstalled on GitHub's Ubuntu runners
